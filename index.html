<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPTU 複本查詢系統</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- SheetJS for Excel processing with styles (xlsx-js-style) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
    <!-- Local Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="ph-duotone ph-magnifying-glass"></i>
                <h1>NPTU 複本查詢工具</h1>
            </div>
            <p class="subtitle">上傳 Excel，透過 ISBN 與書名自動比對館藏系統，檢查是否為複本。</p>
        </header>

        <main class="main-content">
            <!-- Dropzone Area -->
            <div id="dropzone" class="dropzone-container">
                <div class="dropzone-content">
                    <i class="ph-duotone ph-file-xls dropzone-icon"></i>
                    <h2>上傳您的 Excel 檔案</h2>
                    <p>請確認檔案內需有 <strong>ISBN / ISSN / EISSN</strong> 或 <strong>書名 / 刊名</strong> 欄位</p>
                    <label for="file-upload" class="upload-btn">
                        選擇檔案
                        <input type="file" id="file-upload" accept=".xlsx, .xls, .csv" />
                    </label>
                </div>
            </div>

            <!-- Processing Panel -->
            <div id="processing-panel" class="panel" style="display: none;">
                <div class="status-header">
                    <h3 id="process-status">準備處理中...</h3>
                    <span id="process-count">0 / 0</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                
                <div class="actions-footer">
                    <button id="stop-btn" class="btn btn-danger" style="display: none;">
                        <i class="ph-bold ph-stop-circle"></i>
                        停止查詢
                    </button>
                    <button id="download-btn" class="btn btn-primary" disabled>
                        <i class="ph-bold ph-download-simple"></i>
                        匯出結果 (Excel)
                    </button>
                    <button id="reset-btn" class="btn btn-secondary" style="display: none;">
                        <i class="ph-bold ph-arrow-counter-clockwise"></i>
                        重新上傳
                    </button>
                </div>
            </div>

            <!-- Results Panel -->
            <div id="results-panel" class="panel" style="display: none;">
                <h3>即時查詢結果</h3>
                <div class="table-wrapper">
                    <table id="results-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>ISBN / ISSN / EISSN</th>
                                <th>書名 / 刊名</th>
                                <th>作者</th>
                                <th>出版社</th>
                                <th>出版年</th>
                                <th>寫真/限制級</th>
                                <th>是否為複本</th>
                                <th>館藏數量</th>
                                <th>系統連結</th>
                            </tr>
                        </thead>
                        <tbody id="results-tbody">
                            <!-- Dynamic rows appended here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="app.js?v=20260825"></script>
</body>
</html>
